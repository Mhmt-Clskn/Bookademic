# Bookademic – local environment (EN-03, ADR-0001)
# Start everything with:  docker compose up
# Services: db (PostgreSQL 17), api (ASP.NET Core 10), web (Vite + React), mailpit (dev SMTP)

name: bookademic

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookademic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookademic}
      POSTGRES_DB: ${POSTGRES_DB:-bookademic}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookademic} -d ${POSTGRES_DB:-bookademic}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI: http://localhost:8025

  api:
    # Placeholder until backend/Dockerfile exists (multi-stage: sdk:10.0 -> aspnet:10.0).
    # Then replace "image" and "command" with:  build: ./backend
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    command: ["sleep", "infinity"]
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-bookademic};Username=${POSTGRES_USER:-bookademic};Password=${POSTGRES_PASSWORD:-bookademic}
      Smtp__Host: mailpit
      Smtp__Port: "1025"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    # Placeholder until web/Dockerfile exists (Vite + React + Ant Design).
    # Then replace "image" and "command" with:  build: ./web
    image: node:22-alpine
    command: ["sleep", "infinity"]
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
